name: Deploy

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Dashboard code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install package and build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Deploy
        uses: crazy-max/ghaction-github-pages@v2
        with:
          target_branch: gh-pages
          build_dir: public
          fqdn: yacd.kuwi.net
          git_config_name: GitHub Actions
          git_config_email: actions@github.com
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Checkout gh-pages branch
        uses: actions/checkout@v3
        with:
          ref: gh-pages
          path: gh-pages-content
      
      - name: Create gh-pages.zip with top-level directory
        run: |
          mkdir -p temp/gh-pages
          cp -r gh-pages-content/* temp/gh-pages/
          cd temp
          zip -r ../gh-pages.zip . -x "*/.git*"
          ls -la ../gh-pages.zip
      
      - name: Delete existing gh-pages.zip from release
        run: |
          release=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v1.8.8")
          asset_id=$(echo "$release" | jq -r '.assets[] | select(.name == "gh-pages.zip") | .id')
          if [ "$asset_id" != "null" ] && [ -n "$asset_id" ]; then
            echo "Deleting existing gh-pages.zip with asset ID: $asset_id"
            curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/assets/$asset_id"
          else
            echo "No existing gh-pages.zip found in release"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload new gh-pages.zip to Release v1.8.8
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.8
          files: ./gh-pages.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload gh-pages.zip to Cloudflare R2 (meta/)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL || 'https://dl.zwrt.de' }}
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_BUCKET" ]; then
            echo "未配置 R2 密钥, 跳过上传 (请在仓库 Secrets 配置 R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_BUCKET)"
            exit 0
          fi
          ENDPOINT="${R2_ENDPOINT:-https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com}"
          echo "安装 rclone ..."
          curl -s https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          rclone config create r2 s3 \
            provider=Cloudflare \
            access_key_id="$R2_ACCESS_KEY_ID" \
            secret_access_key="$R2_SECRET_ACCESS_KEY" \
            endpoint="$ENDPOINT" \
            --non-interactive
          rclone copy gh-pages.zip "r2:$R2_BUCKET/meta/" -v
          echo "==== 上传完成 ===="
          echo "  ${R2_PUBLIC_URL}/meta/gh-pages.zip"