name: Deploy

on: [push]

concurrency:
  group: deploy-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Dashboard code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install package and build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Deploy
        uses: crazy-max/ghaction-github-pages@v2
        with:
          target_branch: gh-pages
          build_dir: public
          fqdn: yacd.kuwi.net
          git_config_name: GitHub Actions
          git_config_email: actions@github.com
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Checkout gh-pages branch
        uses: actions/checkout@v3
        with:
          ref: gh-pages
          path: gh-pages-content
      
      - name: Create gh-pages.zip with top-level directory
        run: |
          mkdir -p temp/gh-pages
          cp -r gh-pages-content/* temp/gh-pages/
          cd temp
          zip -r ../gh-pages.zip . -x "*/.git*"
          ls -la ../gh-pages.zip
      
      - name: Create new Release with gh-pages.zip (auto-increment version)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 语义化版本递增: patch 到 9 后进位 (v1.8.9 -> v1.9.0), 否则 patch+1
          LATEST=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 2>/dev/null | awk '{print $1}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            NEW_TAG="v1.0.0"
          else
            MAJOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f1)
            MINOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f2)
            PATCH=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f3)
            if [ "$PATCH" -ge 9 ]; then
              NEW_TAG="v${MAJOR}.$((MINOR + 1)).0"
            else
              NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi
          fi
          echo "new_tag=$NEW_TAG"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_ENV"
          gh release create "$NEW_TAG" gh-pages.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$NEW_TAG" \
            --notes "Yacd-meta (ZWRT) dashboard 构建产物. 下载: https://dl.zwrt.de/meta/gh-pages.zip"

      - name: Upload gh-pages.zip to Cloudflare R2 (meta/)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL || 'https://dl.zwrt.de' }}
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_BUCKET" ]; then
            echo "未配置 R2 密钥, 跳过上传 (请在仓库 Secrets 配置 R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_BUCKET)"
            exit 0
          fi
          ENDPOINT="${R2_ENDPOINT:-https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com}"
          echo "安装 rclone ..."
          curl -s https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          rclone config create r2 s3 \
            provider=Cloudflare \
            access_key_id="$R2_ACCESS_KEY_ID" \
            secret_access_key="$R2_SECRET_ACCESS_KEY" \
            endpoint="$ENDPOINT" \
            --non-interactive
          rclone copy gh-pages.zip "r2:$R2_BUCKET/meta/" -v --s3-no-check-bucket
          echo "==== 上传完成 ===="
          echo "  ${R2_PUBLIC_URL}/meta/gh-pages.zip"